<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinemax | Discover</title>
  <link rel="stylesheet" href="../discover/discover.css">
  <link rel="stylesheet" href="../nav-bar/nav-bar.css">
  <link rel="stylesheet" href="../footer/footer.css">
  <link rel="stylesheet" href="../chatbot/chatbot.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>

<body>
    
  <!-- Navbar -->
  <div id="navbar-placeholder"></div>

  <!-- Chatbot -->
  <div id="chatbot-placeholder"></div>


  <main class="container">
    
    <!-- 1. 2025 Highlights Section (Desktop top hero) -->
    <section class="highlight-section">
      <div class="year">
        <span class="y-part">20</span>
        <span class="y-part">25</span>
      </div>
      
      <div class="highlight">
        <h2>Highlights</h2>
        <div class="highlight-grid"></div>
      </div>
    </section>

    <!-- 2. Favorites Section (Below Highlights on Desktop, Top on Mobile) -->
    <div id="favoritesWrapper">
      <h2>Favorites ❤️</h2>
      <section class="movies-section" id="favoritesSection">
        <div id="favoritesContainer" class="movie-grid"></div>
      </section>
    </div>

    <!-- 3. Latest Movies -->
    <h2>Latest Movies</h2>
    <section class="movies-section">
      <div id="movieContainer" class="movie-grid"></div>
    </section>

    <!-- 4. Action Movies -->
    <h2>Action Movies</h2>
    <section class="movies-section">
      <div id="actionContainer" class="movie-grid"></div>
    </section>

    <!-- 5. Fantasy Movies -->
    <h2>Fantasy Movies</h2>
    <section class="movies-section">
      <div id="fantasyContainer" class="movie-grid"></div>
    </section>

    <!-- 6. Horror Movies -->
    <h2>Horror Movies</h2>
    <section class="movies-section">
      <div id="horrorContainer" class="movie-grid"></div>
    </section>

    <!-- 7. Science Fiction Movies -->
    <h2>Science Fiction Movies</h2>
    <section class="movies-section">
      <div id="sciFiContainer" class="movie-grid"></div>
    </section>

    <!-- 8. Romance Movies -->
    <h2>Romance Movies</h2>
    <section class="movies-section">
      <div id="romanceContainer" class="movie-grid"></div>
    </section>

    <!-- 9. Cartoons -->
    <h2>Cartoons</h2>
    <section class="movies-section">
      <div id="cartoonContainer" class="movie-grid"></div>
    </section>

    <!-- Search Results Section (Hidden by Default) -->
    <section id="searchResultsSection" class="movies-section" style="display: none;">
      <h2>Search Results</h2>
      <div id="searchResultsContainer" class="movie-grid"></div>
    </section>

  </main>

  <!-- Footer Place holder -->
     <div id="footer-placeholder"></div>

  <!-- Scripts -->
    <script src="../discover/discover.js"></script>
    <script src="../chatbot/chatbot.js"></script>
    <script src="../nav-bar/nav-bar.js"></script>
    
    <!-- Load Footer -->
    <script>
      fetch("../footer/footer.html")
        .then(res => res.text())
        .then(data => {
          document.getElementById("footer-placeholder").innerHTML = data;
        });
    </script>

</body>
</html>
