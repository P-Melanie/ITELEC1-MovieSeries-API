<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cinemax | Movie Details</title>
  <link rel="stylesheet" href="preview.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <section class="page">
    <div class="page-inner">

      <!-- TOP NAV / SLEEK BACK BUTTON -->
      <div class="top-nav-bar">
        <button class="back-btn" onclick="history.back()">
          <i class="fas fa-arrow-left"></i>
          <span>Back</span>
        </button>
      </div>

      <!-- MAIN DETAIL GRID (SIDE-BY-SIDE ON DESKTOP & SMART GRID ON MOBILE) -->
      <div class="detail-grid">
        <!-- 1. POSTER -->
        <div class="poster-col">
          <img id="poster" src="https://via.placeholder.com/260x390?text=Movie+Poster" alt="Movie Poster">
        </div>

        <!-- 2. CONTENT / INFO COLUMN -->
        <div class="content-col">
          <div class="title-row">
            <h1 id="title">No movie selected.</h1>
            <p class="meta" id="original-title">Original title: N/A</p>
            <p class="meta small" id="meta">Year · Rating · Runtime</p>
          </div>

          <!-- YOUTUBE TRAILER -->
          <div class="trailer-wrapper">
            <div class="trailer-card">
              <iframe 
                id="trailer" 
                width="560" 
                height="315" 
                frameborder="0" 
                allowfullscreen
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
              </iframe>

              <div class="no-trailer">
                <p>No trailer available for this movie.</p>
              </div>
            </div>
          </div>

          <!-- TAGS & STREAMING OPTIONS -->
          <div class="tags-container">
            <div class="tags" id="genre-tags"></div>
            <div class="watch-options" id="watch-options"></div>
          </div>
        </div>
      </div>

      <!-- 3. MOVIE DESCRIPTION / SYNOPSIS -->
      <div class="description">
        <div class="desc-box">
          <h3 class="desc-title">Overview</h3>
          <p id="plot">Movie description will appear here.</p>
          <hr>
          <div class="credits-grid">
            <div class="credit-item">
              <strong>Director</strong>
              <span id="director">N/A</span>
            </div>
            <div class="credit-item">
              <strong>Cast</strong>
              <span id="cast">N/A</span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </section>

  <script src="preview.js"></script>
</body>
</html>
